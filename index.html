<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태오의 첫 번째 생일 초대장</title>
<meta property="og:title" content="태오의 첫 번째 생일 초대장">
<meta property="og:description" content="2026년 9월 5일 토요일 오전 11시 30분, 열두대문한정식 의왕점에서 태오의 첫 돌을 함께 축하해 주세요.">
<meta property="og:image" content="https://cyoon84.github.io/teo-bday/photos/stk_bluejays.png">
<meta property="og:url" content="https://cyoon84.github.io/teo-bday/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'NanumSquareRound'; src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff'); font-weight:normal; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #EAF5FB;
    font-family: 'NanumSquareRound', sans-serif;
    overflow-x: hidden;
    word-break: keep-all;
  }
  a { color: #3E9CC9; text-decoration: none; }
  a:hover { color: #2B7FA8; }
  .stage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .card-outer {
    transform-origin: top center;
    width: fit-content;
  }
  .card {
    width: 520px;
    background: #FCF3E7;
    border: 6px solid #8FCDEB;
    border-radius: 28px;
    padding: 10px;
  }
  .frame {
    border: 2px dashed #B5DEF2;
    border-radius: 20px;
    padding: 40px 36px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #5B4636;
  }
  .crayon-headline {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    letter-spacing: 3px;
    transform: rotate(-2deg);
    text-shadow: 1px 1px 0 rgba(111,188,224,0.35);
  }
  .crayon-headline .first { color: #6FBCE0; }
  .crayon-headline .birthday { color: #F49A9A; }
  .crayon-sub {
    margin-top: 8px;
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 24px;
    color: #8A7462;
    transform: rotate(-1deg);
  }
  .hero-photo {
    margin-top: 20px;
    width: 340px;
    max-width: 100%;
  }
  .title {
    font-family: 'Jua', sans-serif;
    font-weight: normal;
    font-size: 44px;
    margin: 26px 0 0;
    color: #4E9FC7;
    text-align: center;
    line-height: 1.35;
    -webkit-text-stroke: 1px #4E9FC7;
  }
  .greeting {
    margin: 14px 0 0;
    font-size: 18px;
    line-height: 1.8;
    text-align: center;
    color: #7A6552;
  }
  .info-card {
    margin-top: 28px;
    width: 100%;
    background: #fff;
    border-radius: 18px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .info-row {
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .info-label {
    font-family: 'Jua', sans-serif;
    font-size: 17px;
    color: #6FBCE0;
    width: 52px;
    flex: none;
  }
  .info-value {
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;
  }
  .info-value.address {
    font-size: 17px;
    font-weight: normal;
    color: #8A7462;
  }
  .map-card {
    margin-top: 16px;
    width: 100%;
    background: #fff;
    border-radius: 18px;
    padding: 18px 20px 16px;
  }
  .map-card-title {
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    color: #6FBCE0;
    margin-bottom: 10px;
  }
  .map-panel-inner {
    border: 1px solid #EFE6D8;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    text-align: left;
  }
  .map-panel-header {
    padding: 10px 14px;
    background: #F5EFE3;
  }
  .map-panel-title {
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    color: #5B4636;
  }
  #naverMap {
    width: 100%;
    height: 260px;
    background: #EAF5FB;
  }
  .map-panel-footer {
    padding: 10px 14px 12px;
    font-size: 13px;
    color: #7A6552;
  }
  .rsvp-card {
    margin-top: 16px;
    width: 100%;
    background: #fff;
    border-radius: 18px;
    padding: 20px;
  }
  .rsvp-title {
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    color: #6FBCE0;
    margin-bottom: 14px;
  }
  .rsvp-toggle {
    display: flex;
    gap: 10px;
  }
  .rsvp-toggle-btn {
    flex: 1;
    padding: 14px 8px;
    border: 2px solid #EFE6D8;
    border-radius: 14px;
    background: #FFFBF5;
    font-family: 'NanumSquareRound', sans-serif;
    font-weight: bold;
    font-size: 15px;
    color: #8A7462;
    cursor: pointer;
    text-align: center;
  }
  .rsvp-toggle-btn.selected[data-val="yes"] {
    border-color: #8FCDEB;
    background: #EAF5FB;
    color: #3E9CC9;
  }
  .rsvp-toggle-btn.selected[data-val="no"] {
    border-color: #F0B8B8;
    background: #FDF1F1;
    color: #C97575;
  }
  .rsvp-field {
    margin-top: 14px;
  }
  .rsvp-label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #5B4636;
    margin-bottom: 6px;
  }
  .rsvp-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #EFE6D8;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    color: #5B4636;
  }
  .rsvp-guests {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .rsvp-guests[hidden] {
    display: none;
  }
  .rsvp-guests .rsvp-field {
    flex: 1;
    margin-top: 0;
  }
  .rsvp-submit {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 999px;
    background: #8FCDEB;
    color: #fff;
    font-family: 'Jua', sans-serif;
    font-size: 17px;
    cursor: pointer;
  }
  .rsvp-submit:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .rsvp-note {
    margin-top: 10px;
    font-size: 12px;
    color: #B0876E;
    text-align: center;
  }
  .rsvp-success {
    text-align: center;
    color: #3E9CC9;
    font-size: 16px;
    font-weight: bold;
  }
  .closing-photo {
    margin-top: 22px;
    width: 220px;
    max-width: 100%;
    transform: rotate(-2deg);
  }
  .sign-off {
    margin-top: 24px;
    font-size: 17px;
    color: #8A7462;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="card-outer" id="cardOuter">
    <div class="card">
      <div class="frame">
        <div class="crayon-headline"><span class="first">FIRST</span> <span class="birthday">BIRTHDAY</span></div>
        <div class="crayon-sub">저희 아기가 첫 생일을 맞이했어요</div>
        <img class="hero-photo" src="photos/stk_bluejays.png" alt="생일잔치에 초대합니다">
        <h1 class="title">태오의<br>첫 번째 생일</h1>
        <p class="greeting">사랑으로 함께해 주신 모든 분들을 모시고<br>우리 태오의 첫 돌을 축하하려 합니다.<br>귀한 걸음 하시어 자리를 빛내 주세요.</p>

        <div class="info-card">
          <div class="info-row">
            <span class="info-label">날짜</span>
            <span class="info-value">2026년 9월 5일 토요일 오전 11시 30분</span>
          </div>
          <div class="info-row">
            <span class="info-label">장소</span>
            <span class="info-value">열두대문한정식 의왕점</span>
          </div>
          <div class="info-row">
            <span class="info-label">주소</span>
            <span class="info-value address">경기 의왕시 학현로 204</span>
          </div>
        </div>

        <div class="map-card">
          <div class="map-card-title">오시는 길</div>
          <div class="map-panel-inner">
            <div class="map-panel-header">
              <div class="map-panel-title">열두대문한정식 의왕점</div>
            </div>
            <div id="naverMap"></div>
            <div class="map-panel-footer">
              경기 의왕시 학현로 204 ·
              <a href="https://naver.me/5EUX5aej" target="_blank" rel="noopener">네이버 지도 앱에서 열기</a>
            </div>
          </div>
        </div>

        <div class="rsvp-card">
          <div class="rsvp-title">참석 여부를 알려주세요</div>
          <form id="rsvpForm">
            <div class="rsvp-toggle" role="group" aria-label="참석 여부">
              <button type="button" class="rsvp-toggle-btn" data-val="yes">네, 갈게요 🎉</button>
              <button type="button" class="rsvp-toggle-btn" data-val="no">아쉽지만 다음에 뵐게요</button>
            </div>
            <div class="rsvp-field">
              <label class="rsvp-label" for="rsvpName">이름</label>
              <input class="rsvp-input" type="text" id="rsvpName" name="name" placeholder="성함을 입력해 주세요" required>
            </div>
            <div class="rsvp-guests" id="rsvpGuests" hidden>
              <div class="rsvp-field">
                <label class="rsvp-label" for="rsvpAdults">어른</label>
                <input class="rsvp-input" type="number" id="rsvpAdults" name="adults" min="0" value="1" inputmode="numeric">
              </div>
              <div class="rsvp-field">
                <label class="rsvp-label" for="rsvpKids">아이</label>
                <input class="rsvp-input" type="number" id="rsvpKids" name="kids" min="0" value="0" inputmode="numeric">
              </div>
            </div>
            <button type="submit" class="rsvp-submit" id="rsvpSubmit">전달하기</button>
          </form>
          <div class="rsvp-success" id="rsvpSuccess" hidden>전달됐어요. 감사합니다! 🙏</div>
        </div>

        <img class="closing-photo" src="photos/stk_hearthands.png" alt="손하트 하는 태오">
        <div class="sign-off">아빠 · 엄마 올림</div>
      </div>
    </div>
  </div>
</div>

<script>
  const CARD_WIDTH = 520;
  const outer = document.getElementById('cardOuter');
  function fitCard() {
    const available = window.innerWidth - 32; // 16px side padding each side
    const scale = Math.min(1, available / CARD_WIDTH);
    outer.style.transform = scale < 1 ? `scale(${scale})` : '';
  }
  fitCard();
  window.addEventListener('resize', fitCard);

  // --- Naver Map embed ---
  // Get a free Client ID at https://www.ncloud.com (Console > AI·NAVER API > Maps),
  // register this page's domain under the Application's Web service URL, then paste
  // the Client ID below.
  const NAVER_MAPS_CLIENT_ID = 'bzolr4h236';
  const PLACE = {
    lat: 37.3842410,
    lng: 127.0088279,
    name: '열두대문한정식 의왕점'
  };

  loadNaverMap();

  function loadNaverMap() {
    const script = document.createElement('script');
    script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_MAPS_CLIENT_ID}`;
    script.onload = initNaverMap;
    script.onerror = () => {
      document.getElementById('naverMap').innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8A7462;font-size:14px;">지도를 불러오지 못했습니다</div>';
    };
    document.head.appendChild(script);
  }

  function initNaverMap() {
    const position = new naver.maps.LatLng(PLACE.lat, PLACE.lng);
    const map = new naver.maps.Map('naverMap', {
      center: position,
      zoom: 16
    });
    new naver.maps.Marker({ position, map, title: PLACE.name });
  }

  // --- RSVP form ---
  // Google Apps Script Web App URL (deploy the Apps Script, then paste the /exec URL here).
  const RSVP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkbkt3LkXB805JQVJlZqLB0lDyu3YYcfDXCLBlsPst0_hjz-EEcmjOtmujwNz7LeZZfA/exec';

  const rsvpToggleBtns = document.querySelectorAll('.rsvp-toggle-btn');
  const rsvpGuests = document.getElementById('rsvpGuests');
  const rsvpForm = document.getElementById('rsvpForm');
  const rsvpSubmit = document.getElementById('rsvpSubmit');
  const rsvpSuccess = document.getElementById('rsvpSuccess');
  let rsvpAttending = null;

  rsvpToggleBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      rsvpAttending = btn.dataset.val === 'yes';
      rsvpToggleBtns.forEach((b) => b.classList.toggle('selected', b === btn));
      rsvpGuests.hidden = !rsvpAttending;
    });
  });

  rsvpForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (rsvpAttending === null) {
      alert('참석 여부를 선택해 주세요.');
      return;
    }
    const name = document.getElementById('rsvpName').value.trim();
    if (!name) {
      alert('이름을 입력해 주세요.');
      return;
    }
    const payload = {
      name,
      attending: rsvpAttending,
      adults: rsvpAttending ? Number(document.getElementById('rsvpAdults').value || 0) : 0,
      kids: rsvpAttending ? Number(document.getElementById('rsvpKids').value || 0) : 0
    };

    rsvpSubmit.disabled = true;
    rsvpSubmit.textContent = '전달 중...';

    fetch(RSVP_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(() => {
      rsvpForm.hidden = true;
      rsvpSuccess.hidden = false;
    }).catch(() => {
      rsvpSubmit.disabled = false;
      rsvpSubmit.textContent = '전달하기';
      alert('전송에 실패했어요. 잠시 후 다시 시도해 주세요.');
    });
  });
</script>
</body>
</html>
