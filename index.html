<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태오의 첫 번째 생일 — 돌잔치 초대장</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #E9E7E2;
    font-family: 'Pretendard', -apple-system, sans-serif;
    overflow-x: hidden;
  }
  a { color: #2A2A2A; text-decoration: none; }
  a:hover { color: #5FA8CD; }
  .stage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .card-outer {
    transform-origin: top center;
    width: fit-content;
  }
  .card {
    width: 540px;
    background: #F7F5F1;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 12px solid #8FCDEB;
    border-radius: 32px;
    padding: 10px;
  }
  .frame {
    border: 2px dashed #B5DEF2;
    border-radius: 20px;
    padding: 60px 30px 54px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .pattern {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: flex;
    flex-direction: column;
    gap: 26px;
    padding-top: 18px;
    pointer-events: none;
  }
  .pattern-row {
    white-space: nowrap;
    font-size: 40px;
    color: #E4F1FA;
    letter-spacing: 4px;
    font-family: 'Jua', sans-serif;
  }
  .photo-comp {
    position: relative;
    width: 260px;
    height: 460px;
    flex: none;
  }
  .photo-oval {
    position: absolute;
    left: 20px;
    top: 150px;
    width: 220px;
    height: 280px;
    border-radius: 50%;
    overflow: hidden;
  }
  .photo-oval img {
    width: 540px;
    height: 540px;
    margin: -165px 0 0 -142px;
  }
  .hat {
    position: absolute;
    left: 18px;
    top: 24px;
    width: 230px;
    height: 190px;
    background: #6FBCE0;
    clip-path: polygon(52% 0, 0 96%, 100% 78%);
  }
  .balloon-string {
    position: absolute;
    left: 0;
    top: 418px;
    width: 260px;
  }
  .big-one {
    font-weight: 800;
    font-size: 120px;
    line-height: 1;
    color: #3D5A73;
    letter-spacing: -4px;
    position: relative;
  }
  .text-block {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    position: relative;
  }
  .label {
    font-size: 19px;
    font-weight: 600;
    color: #5C5A55;
  }
  .headline {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.25;
  }
  .headline .navy { color: #3D5A73; }
  .headline .sky { color: #7FA8C9; }
  .details {
    font-size: 21px;
    font-weight: 700;
    color: #2A2A2A;
    margin-top: 8px;
  }
  .address {
    font-size: 16px;
    font-weight: 500;
    margin-top: 4px;
  }
  .address a { color: #8B8880; cursor: pointer; }
  .address a:hover { color: #5FA8CD; }

  /* Inline map panel (expands below the address link) */
  .map-panel {
    width: 100%;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.3s ease;
  }
  .map-panel.open {
    max-height: 360px;
    opacity: 1;
    margin-top: 14px;
  }
  .map-panel-inner {
    border: 1px solid #E4E1DA;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    text-align: left;
  }
  .map-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #F0EEE9;
  }
  .map-panel-title {
    font-size: 14px;
    font-weight: 700;
    color: #2A2A2A;
  }
  .map-panel-close {
    border: none;
    background: none;
    font-size: 18px;
    line-height: 1;
    color: #8B8880;
    cursor: pointer;
    padding: 2px 4px;
  }
  .map-panel-close:hover { color: #5FA8CD; }
  #naverMap {
    width: 100%;
    height: 260px;
    background: #E9E7E2;
  }
  .map-panel-footer {
    padding: 10px 14px 12px;
    font-size: 13px;
    color: #5C5A55;
  }
  .map-panel-footer a { color: #8B8880; }
</style>
</head>
<body>
<div class="stage">
  <div class="card-outer" id="cardOuter">
    <div class="card">
      <div class="frame">
        <div class="pattern" id="pattern"></div>
        <div class="photo-comp">
          <div class="photo-oval">
            <img src="photos/hehe.png" alt="태오">
          </div>
          <div class="hat"></div>
          <svg class="balloon-string" viewBox="0 0 260 60">
            <path d="M 78 0 Q 130 46 182 0" stroke="#2A2A2A" stroke-width="1.5" fill="none"></path>
            <path d="M 130 34 Q 118 26 122 40 Q 130 46 130 34 Q 142 26 138 40 Q 130 46 130 34 L 130 52" stroke="#2A2A2A" stroke-width="1.5" fill="none"></path>
          </svg>
        </div>
        <div class="big-one">1</div>
        <div class="text-block">
          <div class="label">함께 축하해 주세요</div>
          <div class="headline"><span class="navy">태오의</span> <span class="sky">첫 번째 생일</span><span class="navy">.</span></div>
          <div class="details">9월 5일 토요일 오후 1시 | 열두대문 의왕점</div>
          <div class="address"><a id="mapTrigger">경기 의왕시 학현로 204 · 지도 보기</a></div>
          <div class="map-panel" id="mapPanel">
            <div class="map-panel-inner">
              <div class="map-panel-header">
                <div class="map-panel-title">열두대문 의왕점</div>
                <button class="map-panel-close" id="mapClose" aria-label="닫기">&times;</button>
              </div>
              <div id="naverMap"></div>
              <div class="map-panel-footer">
                경기 의왕시 학현로 204 ·
                <a href="https://naver.me/5EUX5aej" target="_blank" rel="noopener">네이버 지도 앱에서 열기</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const pattern = document.getElementById('pattern');
  for (let i = 0; i < 14; i++) {
    const row = document.createElement('div');
    row.className = 'pattern-row';
    row.style.marginLeft = i % 2 ? '-160px' : '-40px';
    row.textContent = i % 2 ? 'BIRTHDAY HAPPY BIRTHDAY HAPPY' : 'HAPPY BIRTHDAY HAPPY BIRTHDAY';
    pattern.appendChild(row);
  }

  const CARD_WIDTH = 540;
  const outer = document.getElementById('cardOuter');
  function fitCard() {
    const available = window.innerWidth - 32; // 16px side padding each side
    const scale = Math.min(1, available / CARD_WIDTH);
    outer.style.transform = scale < 1 ? `scale(${scale})` : '';
  }
  fitCard();
  window.addEventListener('resize', fitCard);

  // --- Naver Map embed ---
  // Get a free Client ID at https://www.ncloud.com (Console > AI·NAVER API > Maps),
  // register this page's domain under the Application's Web service URL, then paste
  // the Client ID below.
  const NAVER_MAPS_CLIENT_ID = 'bzolr4h236';
  const PLACE = {
    lat: 37.3842410,
    lng: 127.0088279,
    name: '열두대문 의왕점'
  };

  const panel = document.getElementById('mapPanel');
  const trigger = document.getElementById('mapTrigger');
  const closeBtn = document.getElementById('mapClose');
  let mapLoaded = false;

  function openMap() {
    panel.classList.add('open');
    if (!mapLoaded) {
      mapLoaded = true;
      loadNaverMap();
    }
    setTimeout(() => {
      panel.scrollIntoView({ block: 'end' });
    }, 320);
  }
  function closeMap() {
    panel.classList.remove('open');
  }
  function toggleMap() {
    if (panel.classList.contains('open')) closeMap();
    else openMap();
  }

  trigger.addEventListener('click', (e) => {
    e.preventDefault();
    toggleMap();
  });
  closeBtn.addEventListener('click', closeMap);

  function loadNaverMap() {
    const script = document.createElement('script');
    script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_MAPS_CLIENT_ID}`;
    script.onload = initNaverMap;
    script.onerror = () => {
      document.getElementById('naverMap').innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8B8880;font-size:14px;">지도를 불러오지 못했습니다</div>';
    };
    document.head.appendChild(script);
  }

  function initNaverMap() {
    const position = new naver.maps.LatLng(PLACE.lat, PLACE.lng);
    const map = new naver.maps.Map('naverMap', {
      center: position,
      zoom: 16
    });
    new naver.maps.Marker({ position, map, title: PLACE.name });
  }
</script>
</body>
</html>
